name: "build"

on: pull_request

jobs:
  publish-tauri:
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1 and above).
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: ""
            args: ""
          - platform: "windows-latest"
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json # uses the volta.node pin
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: release-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Outliner v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload linux assets
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'ubuntu-22.04'
        with:
          name: pr-${{github.event.pull_request.number }}-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload windows assets
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'windows-latest'
        with:
          name: pr-${{github.event.pull_request.number }}-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macos assets
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'macos-latest'
        with:
          name: pr-${{github.event.pull_request.number }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: auto-build-comment-${{ matrix.platform }}-${{ matrix.target }}
          message: |
            Build for ${{ matrix.platform }} ${{ matrix.target }} is done.
            Uploaded Assets:
            ${{ steps.tauri.outputs.artifactPaths }}
